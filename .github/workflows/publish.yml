name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不能设置 registry-url：它会在 runner 的 .npmrc 写入
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，使 npm publish
      # 改用该 token 认证而跳过 OIDC，最终以 E404 失败。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # trusted publishing 要求 npm >= 11.5.1；固定 11.x 而非 latest，
      # 避免 npm 12 的 node engines 门槛在 CI 上触发 EBADENGINE。
      - name: 升级 npm
        run: npm install -g npm@11

      - name: 安装依赖
        run: npm ci

      - name: 构建库产物与类型声明
        run: npm run build:lib

      - name: 发布到 npm
        run: npm publish --provenance --access public
