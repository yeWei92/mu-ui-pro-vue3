<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- 字母主色：冷冽蓝紫 -->
    <linearGradient id="letterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="35%" stop-color="#2B7BE4"/>
      <stop offset="70%" stop-color="#1A4F8E"/>
      <stop offset="100%" stop-color="#0F2B5C"/>
    </linearGradient>

    <!-- 霓虹青蓝 -->
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- 紫色光晕 -->
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0033AA" flood-opacity="0.30"/>
    </filter>

    <filter id="neonStrong">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonSoft">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#80E0FF" flood-opacity="0.30"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- 纯色深蓝背景 -->
  <rect width="500" height="500" fill="#0A0E1A" rx="20"/>

  <g filter="url(#mainShadow)">

    <!-- ========== 字母 M（整体右移3px：x从20→23，结束从270→273） ========== -->
    <g>
      <path d="
        M 23 70
        L 23 430
        L 93 430
        L 93 260
        L 148 325
        L 203 270
        L 203 430
        L 273 430
        L 273 70
        L 203 70
        L 203 185
        L 148 245
        L 93 175
        L 93 70
        Z
      "
            fill="url(#letterGrad)"
            filter="url(#innerGlow)"/>

      <path d="
        M 23 70
        L 53 70
        L 53 430
        L 23 430
        Z
      "
            fill="#FFFFFF" opacity="0.12"/>

      <path d="
        M 23 70
        L 23 430
      "
            fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.5" filter="url(#neonSoft)"/>

      <path d="
        M 116 210
        L 148 325
        L 203 270
        L 203 295
        L 148 355
        L 116 235
        Z
      "
            fill="url(#cyanGlow)"
            opacity="0.5"
            filter="url(#neonStrong)"/>

      <path d="
        M 103 225
        L 148 305
        L 203 245
        L 203 260
        L 148 325
        L 103 240
        Z
      "
            fill="url(#purpleGlow)"
            opacity="0.25"
            filter="url(#neonStrong)"/>

      <rect x="23" y="70" width="250" height="7" rx="3.5" fill="url(#cyanGlow)" opacity="0.55" filter="url(#neonSoft)"/>

      <path d="
        M 93 175 L 148 245 L 203 185
      "
            fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.15"/>
    </g>

    <!-- ========== 字母 U（整体右移3px：x从305→308，结束从475→478） ========== -->
    <g>
      <path d="
        M 308 110
        L 308 375
        C 308 435 348 460 398 460
        C 448 460 478 435 478 375
        L 478 110
        L 408 110
        L 408 368
        C 408 390 398 400 398 400
        C 388 400 378 390 378 368
        L 378 110
        Z
      "
            fill="url(#letterGrad)"
            filter="url(#innerGlow)"/>

      <path d="
        M 308 110
        L 338 110
        L 338 375
        C 338 395 346 408 361 415
        L 308 415
        Z
      "
            fill="#FFFFFF" opacity="0.10"/>

      <path d="
        M 308 110
        L 308 375
        C 308 415 328 440 358 448
      "
            fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.5" filter="url(#neonSoft)"/>

      <path d="
        M 323 420
        C 343 450 373 458 398 458
        C 423 458 448 450 465 420
      "
            fill="none"
            stroke="url(#cyanGlow)"
            stroke-width="5"
            stroke-linecap="round"
            opacity="0.6"
            filter="url(#neonStrong)"/>

      <path d="
        M 335 428
        C 351 448 378 452 398 452
        C 418 452 440 448 455 428
      "
            fill="none"
            stroke="url(#purpleGlow)"
            stroke-width="2.5"
            stroke-linecap="round"
            opacity="0.3"
            filter="url(#neonStrong)"/>

      <rect x="308" y="110" width="170" height="7" rx="3.5" fill="url(#cyanGlow)" opacity="0.55" filter="url(#neonSoft)"/>
    </g>

    <!-- ========== 连接元素 ========== -->
    <path d="M 273 155 Q 290 155, 308 155" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.3" stroke-dasharray="4 4"/>
    <path d="M 273 200 Q 290 200, 308 200" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.2" stroke-dasharray="2 6"/>
    <path d="M 253 448 Q 280 468, 308 448" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.2" stroke-dasharray="3 5"/>

    <!-- ========== 科技粒子 ========== -->
    <circle cx="63" cy="100" r="3.5" fill="#00F0FF" opacity="0.7" filter="url(#neonSoft)"/>
    <circle cx="118" cy="85" r="2.5" fill="#00F0FF" opacity="0.4"/>
    <circle cx="233" cy="95" r="3" fill="#A855F7" opacity="0.5" filter="url(#neonSoft)"/>
    <circle cx="441" cy="135" r="3.5" fill="#00F0FF" opacity="0.7" filter="url(#neonSoft)"/>
    <circle cx="455" cy="420" r="2.5" fill="#00F0FF" opacity="0.4"/>
    <circle cx="363" cy="472" r="3" fill="#A855F7" opacity="0.5" filter="url(#neonSoft)"/>
    <circle cx="153" cy="445" r="2" fill="#00F0FF" opacity="0.3"/>

    <!-- ========== 轨道环 ========== -->
    <ellipse cx="251" cy="400" rx="230" ry="30" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.08"/>
    <ellipse cx="251" cy="400" rx="255" ry="42" fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.06"/>

    <!-- ========== 描边 ========== -->
    <path d="
      M 23 70 L 23 430 L 93 430 L 93 260 L 148 325 L 203 270 L 203 430 L 273 430 L 273 70 L 203 70 L 203 185 L 148 245 L 93 175 L 93 70 Z
      M 308 110 L 308 375 C 308 435 348 460 398 460 C 448 460 478 435 478 375 L 478 110 L 408 110 L 408 368 C 408 390 398 400 398 400 C 388 400 378 390 378 368 L 378 110 Z
    "
          fill="none"
          stroke="#4FACFE"
          stroke-width="1.5"
          stroke-linejoin="round"
          stroke-linecap="round"
          opacity="0.25"/>

  </g>
</svg>
